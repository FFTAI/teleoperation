defaults:
  - hand: fourier_dexpilot_dhx
  - robot: "gr1t1_legacy"
  - camera: oak_97
  - policy: gr00t
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

debug: false
debug_hand: false
sim: false
wait_time: 5.0
frequency: 30
use_waist: false
use_head: false
use_depth: false

cpu:
  affinity: []
  niceness: -5

recording:
  enabled: false
  task_name: "eval"

joint_filter:
  min_cutoff: 0.01
  beta: 10.0

hand_filter:
  min_cutoff: 0.001
  beta: 50.0

head_filter:
  alpha: 0.7

upsampler:
  frequency: 120
  gravity_compensation: false

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${recording.task_name}/${now:%Y-%m-%d_%H-%M-%S}
  verbose: ["teleoperation"]

camera:
  instance:
    eval_mode: true

eval:
  rerun_enabled: false
  rerun_endpoint: 192.168.31.184:9876

  prompt: "Put the blue clamp inside the plate"

  display_keys:
    states:
      ["waist", "neck", "left_arm", "right_arm", "left_hand", "right_hand"]
    actions:
      ["waist", "neck", "left_arm", "right_arm", "left_hand", "right_hand"]

  modality_mask:
    states: []
    actions: []

  cameras:
    observation.images.top:
      stream: rgb
      name: top
