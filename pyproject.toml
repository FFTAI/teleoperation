[project]
name = "teleoperation"
version = "0.5.9"
description = "Teleoperation for Fourier Robots"
authors = [{ name = "Yuxiang Gao", email = "yuxiang.gao@fftai.com" }]
dependencies = [
    "numpy>=1.26.4",
    "h5py>=3.11.0",
    "vuer[all]==0.0.32rc8",
    "tqdm>=4.66.5",
    "rich>=13.8.1",
    "opencv-python>=4.10.0.84",
    "opencv-contrib-python>=4.10.0.84",
    "pynput>=1.7.7",
    "omegaconf>=2.3.0",
    # "torch~=2.4.1",
    # "torchvision~=0.19.1",
    "dex-retargeting==0.4.6",
    "pin-pink>=3.0.0",
    "rerun-sdk>=0.22.0",
    "meshcat>=0.3.2",
    "meshcat-shapes>=0.3.0",
    "numba>=0.60.0",
    "pillow>=11.0.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
]
requires-python = "~=3.10,<3.12"
readme = "README.md"
license = { text = "MIT" }


[project.optional-dependencies]
webrtc = [
    "aiohttp>=3.10.5",
    "aiohttp-cors>=0.7.0",
    "aiortc>=0.9.8",
    "av>=12.3.0",
]
realsense = ["pyrealsense2>=2.55.1.6486"]
depthai = ["depthai-sdk>=1.15.0", "av>=13.1.0"]
cpu = ["torch==2.5.1+cpu", "torchvision==0.20.1+cpu"]
gpu = ["torch", "torchvision"]
fourier = ["fourier-grx-client==0.2.0a8", "fourier-dhx>=0.0.2"]
lerobot = ["lerobot[pi0]"]

[tool.uv]
package = true
default-groups = ["fourier"]
environments = ["sys_platform == 'linux' and platform_machine != 'aarch64'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "lerobot" }]]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-gpu", extra = "gpu" },
]
pre-commit = { index = "tuna" }
lerobot = { path = "../fourier-lerobot", editable = true }
rerun-sdk = { index = "tuna" }

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


# [build-system]
# requires = ["pdm-backend"]
# build-backend = "pdm.backend"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["**/*.py", "**/*.pyi", "**/pyproject.toml"]
exclude = [".venv", "build", "dist", "scripts", "src/teleoperation/webrtc"]
line-length = 120

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle - Error
    "W",   # pycodestyle - Warning
    "F",   # Pyflakes
    'PLC',
    'PLE',
    'PLW', # Pylint
    "I",   # isort
    "UP",  # pyupgrade
    "NPY", # numpy
]
ignore = [
    "E501", # line-too-long
    # "F401", # unused import
    "F841", # unused variable,
    "E741", # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["teleoperation"]


[tool.pyright]
include = ["src/**/*.py"]
pythonVersion = "3.11"
pythonPlatform = "Linux"

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
teleoperation = "teleoperation.main:main"
# [tool.pdm.scripts]
# doc = { cmd = "mkdocs serve", help = "Start the dev server for docs preview" }
# lint = "pre-commit run --all-files"
# publish = "pdm publish -v -u __token__"
# publish_doc = "mike deploy --push --update-aliases"


[dependency-groups]
dev = [
    "markdown-exec>=1.10.0",
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.49",
    "mkdocstrings[python]>=0.27.0",
    "pre-commit>=4.0.1",
    "pyright>=1.1.391",
    "pytest>=8.3.4",
    "ruff>=0.9.1",
]
fourier = ["fourier-grx-client==0.2.0a8", "fourier-dhx>=0.0.2"]
